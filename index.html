<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Apontaí</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f343a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apontaí">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<style>
:root{--bg:#d9dce0;--card:#fff;--text:#1b1f23;--muted:#555c64;--line:#d0d4d8;--grid:#a4abb2;--brand:#ad5c1a;--brand-t:#fff;--danger:#c0392b;--zebra:#f7f8f9;--gut:#e8eaec;--shadow:0 2px 10px rgba(0,0,0,.08);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1e2125;--text:#eceef0;--muted:#9aa1a9;--line:#33383e;--grid:#575e66;--brand:#e8964a;--brand-t:#1c1006;--danger:#ff7b6b;--zebra:#2f343a;--gut:#25282d;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 50px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:120px;overscroll-behavior-y:contain;display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{padding:14px 12px 10px;max-width:760px;width:100%;margin:0 auto}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.hbtns{display:flex;gap:6px;flex:0 0 auto;margin-top:2px}
.hbtns .pbtn{display:flex;align-items:center;justify-content:center}
h1{font-size:24px;margin:0;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
main{padding:0 8px;max-width:760px;width:100%;margin:0 auto;flex:1}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 8px 2px}
.tbl{--card:#fff;--text:#1b1f23;--muted:#5f666d;--line:#d0d4d8;--grid:#a4abb2;--zebra:#f1f3f4;--gut:#e6e8ea;--danger:#c0392b;color-scheme:light;background:var(--card);border:1.5px solid var(--grid);border-radius:14px;box-shadow:var(--shadow);overflow:clip}
.r{display:grid;grid-template-columns:30px repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.r:nth-child(even):not(.h){background:var(--zebra)}
.h{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--brand);border-bottom:0}
.hc{display:flex;align-items:center;border-left:1px solid rgba(255,255,255,.35);min-width:0}
.h textarea{font:700 12px/1.25 system-ui,sans-serif;color:var(--brand-t);background:transparent;padding:12px 4px;text-align:center;text-transform:uppercase;letter-spacing:.3px;box-shadow:none}
.hc:focus-within{background:rgba(255,255,255,.2)}
.h textarea:focus{background:transparent;box-shadow:none}
.h .g{background:transparent;color:var(--brand-t)}
.g{background:var(--gut);border:0;border-right:1px solid var(--grid);color:var(--muted);font:600 11px system-ui,sans-serif;padding:0;display:flex;align-items:flex-start;justify-content:center;padding-top:11px}
.g{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.h .g{cursor:default}
.r.drag:not(.h){position:relative;z-index:3;background:#fbeedd!important;box-shadow:0 6px 18px rgba(0,0,0,.28);transition:none}
.r.dropb{box-shadow:inset 0 3px 0 #ad5c1a}
.r.dropa{box-shadow:inset 0 -3px 0 #ad5c1a}
.r[hidden]{display:none}
.g.armed{background:var(--danger);color:#fff;font-size:16px;padding-top:7px}
.c{display:flex;border-left:1px solid var(--line);min-width:0}
.c:nth-child(2){border-left:0}
textarea{font:inherit;font-size:15px;line-height:1.25;color:var(--text);background:transparent;border:0;border-radius:0;padding:9px 5px;width:100%;min-width:0;resize:none;outline:none;overflow:hidden;display:block}
textarea:focus{background:#fbeedd;box-shadow:inset 0 0 0 2px #ad5c1a}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar{display:flex;align-items:center;gap:6px;padding:8px 10px 0;max-width:760px;margin:0 auto}
.tabs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;max-width:150px;height:34px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:600 14px system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--brand-t)}
input.tab{width:130px;font-size:16px;outline:none;text-overflow:clip;cursor:text}
.pbtn{flex:0 0 auto;width:34px;height:34px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:700 16px system-ui,sans-serif;padding:0}
.pbtn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;max-width:760px;margin:0 auto}
.bar button[hidden]{display:none}
.bar button{border:0;border-radius:12px;height:40px;padding:0 16px;font:700 15px system-ui,sans-serif}
#add{background:var(--brand);color:var(--brand-t);box-shadow:var(--shadow)}
#exp,#inst{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
#undo,#redo{width:40px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--text);border:1.5px solid var(--line)}
#redo svg{transform:scaleX(-1)}
.bar button:disabled{opacity:.35}
.bar button:disabled:active{transform:none}
#exp{margin-left:auto}
button:active{transform:scale(.97)}
#toast{position:fixed;left:50%;bottom:calc(var(--dockh,100px) + 12px);transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.searchbar{display:flex;gap:6px;padding:8px 10px 0;max-width:760px;margin:0 auto}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;min-width:0;height:34px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:16px system-ui,sans-serif;padding:0 12px;outline:none}
.searchbar input:focus{border-color:var(--brand)}
#sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sh-box{position:relative;width:100%;max-width:520px;background:var(--card);color:var(--text);border-radius:18px 18px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sh-t{font:700 16px system-ui,sans-serif;margin:0 4px 4px}
.sh-d{color:var(--muted);font-size:13px;margin:0 4px 12px}
.sh-b{display:flex;flex-direction:column;gap:8px}
.sh-b button{height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:700 15px system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-b button.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-t)}
.sh-b input{height:46px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:16px system-ui,sans-serif;outline:none}
.sh-b input:focus{border-color:var(--brand)}
.sh-d.err{color:var(--danger)}
/* ---------- Animação de abertura ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#22262b,#16181c 55%,#0c0d0f);animation:sp-out .45s ease 2.3s forwards}
#splash svg{width:min(82vw,82vh,460px);height:auto;overflow:visible;animation:sp-in .75s cubic-bezier(.2,.9,.3,1.25) both}
#splash .sp-min,#splash .sp-hr{transform-box:view-box;transform-origin:168px 250px}
#splash .sp-min{animation:sp-min 1.7s cubic-bezier(.3,0,.2,1) .15s both}
#splash .sp-hr{animation:sp-hr 1.7s cubic-bezier(.3,0,.2,1) .15s both}
#splash .sp-hand{animation:sp-hand .7s cubic-bezier(.2,.9,.3,1.15) .45s both}
#splash .sp-name{animation:sp-name .6s cubic-bezier(.2,.8,.3,1) .95s both}
@keyframes sp-name{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes sp-in{from{transform:scale(.25);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sp-min{from{transform:rotate(-1080deg)}to{transform:rotate(0)}}
@keyframes sp-hr{from{transform:rotate(-360deg)}to{transform:rotate(0)}}
@keyframes sp-hand{from{transform:translate(170px,24px);opacity:0}to{transform:translate(0,0);opacity:1}}
@keyframes sp-out{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash,#splash *{animation-duration:.01s!important;animation-delay:0s!important}#splash{animation:sp-out .3s ease .8s forwards!important}}
</style>
</head>

<script>
(function(){
"use strict";
var KEY="apontamentos:v2",OLDKEY="apontamentos:v1";
var DEF=["Hora início","Hora final","Qtd colaboradores","Cod","Descrição"];
var OLD="Data|Local|Descrição|Qtd|Obs";
var storageOk=true;
var state={pages:[],active:null},renaming=null,booted=false;

/* ---------- Salvamento ---------- */
function newPage(name,cols,n){
  var p={id:uid(),name:name,cols:(cols||DEF).slice(0,5),rows:[],c:Date.now()};
  for(var i=0;i<(n||0);i++)p.rows.push(blank());
  return p;
}
function fix(p,i){
  if(!p.id)p.id=uid();
  if(!p.c)p.c=Date.now()-1e10+(i||0); /* páginas antigas: mantém a ordem atual */
  if(!p.name)p.name="Página";
  if(!p.cols)p.cols=DEF.slice();
  if(p.cols.slice(0,5).join("|")===OLD)p.cols=DEF.slice();
  while(p.cols.length<5)p.cols.push("Coluna "+(p.cols.length+1));
  if(!p.rows)p.rows=[];
  return p;
}
function cur(){
  for(var i=0;i<state.pages.length;i++)if(state.pages[i].id===state.active)return state.pages[i];
  return state.pages[0];
}
function load(){
  var p=null;
  try{
    var s=localStorage.getItem(KEY)||localStorage.getItem(OLDKEY); /* v1 = dados da versão sem páginas */
    if(s)p=JSON.parse(s);
  }catch(e){storageOk=false}
  if(p&&p.pages&&p.pages.length){state.pages=p.pages.map(function(x,i){return fix(x,i)});state.active=p.active}
  else if(p&&p.cols&&p.rows){state.pages=[fix({name:"Página 1",cols:p.cols,rows:p.rows})]}
  if(!state.pages.length)state.pages=[newPage("Página 1",DEF,5)];
  if(!state.pages.some(function(x){return x.id===state.active}))state.active=state.pages[0].id;
}
var t=null;
function save(now){
  clearTimeout(t);
  if(booted){var c=cur();if(c)c.u=Date.now()} /* quando a página foi editada por último (resolve conflitos) */
  var go=function(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOk=false}};
  if(now)go();else t=setTimeout(go,250);
  syncSchedule();
}
window.addEventListener("pagehide",function(){save(true)});
document.addEventListener("visibilitychange",function(){if(document.hidden)save(true)});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

/* ---------- Gerador de XLSX (sem bibliotecas, funciona offline) ---------- */
var CRC=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){
  var enc=new TextEncoder(),parts=[],cen=[],off=0,cenSize=0;
  files.forEach(function(f){
    var name=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);
    var l=new Uint8Array(30+name.length),v=new DataView(l.buffer);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);
    v.setUint16(12,0x21,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);
    v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);l.set(name,30);
    var c=new Uint8Array(46+name.length),w=new DataView(c.buffer);
    w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x0800,true);
    w.setUint16(14,0x21,true);w.setUint32(16,crc,true);w.setUint32(20,data.length,true);
    w.setUint32(24,data.length,true);w.setUint16(28,name.length,true);w.setUint32(42,off,true);c.set(name,46);
    parts.push(l,data);cen.push(c);off+=l.length+data.length;cenSize+=c.length;
  });
  var end=new Uint8Array(22),e=new DataView(end.buffer);
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,cenSize,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[end]),{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function esc(s){return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* "7:30", "07:30", "7h30", "7.30", "730", "0730", "8" → fração do dia (formato hora no Excel). Se não der para entender, fica como texto. */
function parseTime(v){
  var t=String(v).trim().toLowerCase().replace(/\s+/g,""),m=t.match(/^(\d{1,2})(?:[:h.,](\d{1,2}))?(?::\d{2})?h?$/);
  if(!m)m=t.match(/^(\d{1,2})(\d{2})$/);

function parseNum(v){

function sheetXml(header,rows){
  var all=[header].concat(rows);

      if(i>0&&(j===2||j===3)){num=parseNum(v);if(num!==null){sheet+='<c r="'+ref+'" s="4"><v>'+num+'</v></c>';return}}
      sheet+='<c r="'+ref+'" t="inlineStr"'+(i===0?' s="1"':' s="2"')+'><is><t xml:space="preserve">'+esc(v)+'</t></is></c>';
    });

  });

function sheetName(s,used){
  var n=String(s||"").replace(/[\\\/\?\*\[\]:]/g,"-").replace(/^'+|'+$/g,"").trim().slice(0,31)||"Página";
  var base=n,k=2;
  while(used[n.toLowerCase()]){var suf=" ("+k+")";n=base.slice(0,31-suf.length)+suf;k++}

function buildXlsx(sheets){

    {name:"xl/workbook.xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="'+NS+'spreadsheetml/2006/main" xmlns:r="'+NS+'officeDocument/2006/relationships"><sheets>'+wb+'</sheets></workbook>'},
    {name:"xl/_rels/workbook.xml.rels",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="'+NS+'package/2006/relationships">'+rel+'</Relationships>'},
    {name:"xl/styles.xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="'+NS+'spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="hh:mm"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFAD5C1A"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},

var $=function(id){return document.getElementById(id)};
var tbl=$("tbl");

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function blank(){return{id:uid(),v:["","","","",""]}}
function growRow(el){
  var ta=el.querySelectorAll("textarea"),m=0,i;
  for(i=0;i<ta.length;i++){ta[i].style.height="auto"}
  for(i=0;i<ta.length;i++){m=Math.max(m,ta[i].scrollHeight)}
  for(i=0;i<ta.length;i++){ta[i].style.height=m+"px"}
}
function growHead(){tbl.querySelectorAll(".h textarea").forEach(function(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"})}
function growAll(){growHead();tbl.querySelectorAll(".r:not(.h)").forEach(growRow)}
function header(){
  var pg=cur(),h=document.createElement("div");h.className="r h";
  var g=document.createElement("div");g.className="g";g.textContent="#";h.appendChild(g);
  for(var i=0;i<5;i++)(function(i){
    var w=document.createElement("div");w.className="hc";
    var inp=document.createElement("textarea");inp.rows=1;inp.value=pg.cols[i];inp.maxLength=40;
    inp.setAttribute("aria-label","Nome da coluna "+(i+1));
    inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();inp.blur()}});
    inp.addEventListener("input",function(){pg.cols[i]=inp.value||("Coluna "+(i+1));growHead();save()});
    w.appendChild(inp);h.appendChild(w);
  })(i);
  return h;
}
function rowEl(r,n){
  var pg=cur(),el=document.createElement("div");el.className="r";el.dataset.id=r.id;
  var g=document.createElement("button");g.className="g";g.textContent=n;g.setAttribute("aria-label","Excluir linha "+n);
  var moved=false;
  g.addEventListener("click",function(){
    if(moved){moved=false;return} /* o clique que sobra depois de arrastar não deve armar a exclusão */
    if(!g.classList.contains("armed")){
      g.classList.add("armed");g.textContent="×";
      setTimeout(function(){g.classList.remove("armed");g.textContent=n},2500);return;
    }
    var at=idxOf(pg.rows,r.id);if(at<0)return;pg.rows.splice(at,1);pushOp({t:"row",pid:pg.id,i:at,row:r});save(true);render();
  });
  /* Arrastar pelo número da linha para mudar de posição */
  (function(){
    var pid=null,sy=0,sp=0,ly=0,raf=0,dragging=false,others=[],from=0,target=0,warned=false;
    function update(){
      var page=ly+window.scrollY,dy=page-(sy+sp),k=0;
      el.style.transform="translateY("+dy+"px)";
      while(k<others.length&&others[k].mid<page)k++;
      target=k;
      others.forEach(function(o){o.el.classList.remove("dropb","dropa")});
      if(k<others.length)others[k].el.classList.add("dropb");
      else if(others.length)others[k-1].el.classList.add("dropa");
    }
    function loop(){
      if(!dragging)return;
      var lim=window.innerHeight-dock.offsetHeight-40;
      if(ly<110)window.scrollBy(0,-Math.min(16,(110-ly)/4+2));
      else if(ly>lim)window.scrollBy(0,Math.min(16,(ly-lim)/4+2));
      update();raf=requestAnimationFrame(loop);
    }
    function start(){
      dragging=true;moved=true;
      g.classList.remove("armed");g.textContent=n;
      from=idxOf(pg.rows,r.id);others=[];
      tbl.querySelectorAll(".r:not(.h)").forEach(function(x,k){
        if(k===from)return;
        var b=x.getBoundingClientRect();others.push({el:x,mid:b.top+window.scrollY+b.height/2});
      });
      el.classList.add("drag");
      if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
      loop();
    }
    function end(e,cancel){
      if(pid!==e.pointerId)return;
      pid=null;cancelAnimationFrame(raf);
      try{g.releasePointerCapture(e.pointerId)}catch(_){}
      if(!dragging)return;
      dragging=false;
      if(!cancel&&target!==from){
        var row=pg.rows.splice(from,1)[0];pg.rows.splice(target,0,row);
        pushOp({t:"move",pid:pg.id,id:r.id,from:from,to:target});save(true);
      }
      render();
    }
    g.addEventListener("pointerdown",function(e){
      if(e.pointerType==="mouse"&&e.button!==0)return;
      moved=false;dragging=false;warned=false;pid=e.pointerId;sy=ly=e.clientY;sp=window.scrollY;
      try{g.setPointerCapture(pid)}catch(_){}
    });
    g.addEventListener("pointermove",function(e){
      if(pid!==e.pointerId)return;
      ly=e.clientY;
      if(!dragging){
        if(Math.abs(ly-sy)<8)return;
        if(query.trim()){if(!warned){warned=true;toast("Limpe a busca para mover linhas")}return}
        start();
      }
      update();
    });
    g.addEventListener("pointerup",function(e){end(e,false)});
    g.addEventListener("pointercancel",function(e){end(e,true)});
    g.addEventListener("contextmenu",function(e){e.preventDefault()});
  })();
  el.appendChild(g);
  for(var i=0;i<5;i++)(function(i){
    var c=document.createElement("div");c.className="c";
    var ta=document.createElement("textarea");ta.rows=1;ta.value=r.v[i]||"";
    ta.setAttribute("aria-label",pg.cols[i]+", linha "+n);
    ta.addEventListener("input",function(){r.v[i]=ta.value;growRow(el);save()});
    /* Enter = Tab (próxima coluna; na última, vai para a 1ª coluna da linha de baixo). Shift+Enter quebra linha. */
    ta.addEventListener("keydown",function(e){
      if(e.key!=="Enter"||e.shiftKey||e.isComposing)return;
      e.preventDefault();
      var next=null,cells=el.querySelectorAll("textarea");
      if(i<cells.length-1)next=cells[i+1];
      else{var s=el.nextElementSibling;while(s&&s.hidden)s=s.nextElementSibling;if(s)next=s.querySelector("textarea")}
      if(next){next.focus();if(next.select)next.select()}else ta.blur();
    });
    c.appendChild(ta);el.appendChild(c);
  })(i);
  return el;
}
function render(){
  var pg=cur(),y=window.scrollY;

  tbl.appendChild(header());
  pg.rows.forEach(function(r,k){tbl.appendChild(rowEl(r,k+1))});
  growAll();applyFilter();
  tbl.style.minHeight="";
  window.scrollTo(0,y);
  renderTabs();
}

/* ---------- Páginas (abas) ---------- */
var tabs=$("tabs"),delp=$("delp"),delArmed=false,delT=null;
function disarm(){clearTimeout(delT);delArmed=false;delp.classList.remove("armed");delp.textContent="🗑"}
function renderTabs(){
  tabs.innerHTML="";
  state.pages.forEach(function(p){
    if(renaming===p.id){
      var inp=document.createElement("input");inp.className="tab on";inp.value=p.name;inp.maxLength=24;
      inp.setAttribute("aria-label","Nome da página");
      var done=false;
      var finish=function(ok){
        if(done)return;done=true;
        var v=inp.value.trim();
        if(ok&&v)p.name=v;
        renaming=null;save(true);renderTabs();
      };
      inp.addEventListener("keydown",function(e){
        if(e.key==="Enter"){e.preventDefault();finish(true)}
        else if(e.key==="Escape"){finish(false)}
      });
      inp.addEventListener("blur",function(){finish(true)});
      tabs.appendChild(inp);
      inp.focus();inp.select();
    }else{
      var on=p.id===state.active;
      var b=document.createElement("button");b.className="tab"+(on?" on":"");b.textContent=p.name;
      b.setAttribute("aria-label","Página "+p.name+(on?", toque para renomear":""));
      b.addEventListener("click",function(){
        if(on){renaming=p.id;renderTabs();return}
        state.active=p.id;renaming=null;disarm();save(true);render();window.scrollTo(0,0);
      });
      tabs.appendChild(b);
    }
  });
  var a=tabs.querySelector(".on");
  if(a){
    var l=a.offsetLeft,r=l+a.offsetWidth;
    if(l<tabs.scrollLeft)tabs.scrollLeft=l-8;
    else if(r>tabs.scrollLeft+tabs.clientWidth)tabs.scrollLeft=r-tabs.clientWidth+8;
  }
}
/* ---------- Desfazer / Refazer (exclusões de linhas e páginas) ---------- */
var undoS=[],redoS=[];
function idxOf(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return i;return -1}
function histBtns(){$("undo").disabled=!undoS.length;$("redo").disabled=!redoS.length}
function pushOp(op){undoS.push(op);if(undoS.length>50)undoS.shift();redoS=[];histBtns()}
function pageById(id){var i=idxOf(state.pages,id);return i<0?null:state.pages[i]}
function moveRow(pid,id,to){
  var pg=pageById(pid);if(!pg)return false;
  var at=idxOf(pg.rows,id);if(at<0)return false;
  var row=pg.rows.splice(at,1)[0];
  pg.rows.splice(Math.min(to,pg.rows.length),0,row);state.active=pg.id;
  return true;
}
function undoOp(op){
  if(op.t==="move")return moveRow(op.pid,op.id,op.from);
  if(op.t==="row"){
    var pg=pageById(op.pid);if(!pg)return false;
    pg.rows.splice(Math.min(op.i,pg.rows.length),0,op.row);state.active=pg.id;
  }else{
    state.pages.splice(Math.min(op.i,state.pages.length),0,op.page);state.active=op.page.id;
  }
  return true;
}
function redoOp(op){
  if(op.t==="move")return moveRow(op.pid,op.id,op.to);
  if(op.t==="row"){
    var pg=pageById(op.pid);if(!pg)return false;
    var at=idxOf(pg.rows,op.row.id);if(at<0)return false;
    pg.rows.splice(at,1);state.active=pg.id;
  }else{
    var i=idxOf(state.pages,op.page.id);if(i<0||state.pages.length<2)return false;
    state.pages.splice(i,1);state.active=state.pages[Math.max(0,i-1)].id;
  }
  return true;
}
function stepHistory(from,to,fn,msg){
  var op=from.pop();if(!op)return;
  if(!fn(op)){histBtns();toast("Não foi possível");return}
  to.push(op);histBtns();renaming=null;disarm();save(true);render();
  toast(op.t==="move"?(from===undoS?"Movimento desfeito":"Movimento refeito"):msg+(op.t==="row"?"linha":"página"));
}
$("undo").addEventListener("click",function(){stepHistory(undoS,redoS,undoOp,"Restaurada: ")});
$("redo").addEventListener("click",function(){stepHistory(redoS,undoS,redoOp,"Excluída de novo: ")});

/* ---------- Exportar XLSX (esta página ou todas) ---------- */
function download(blob,name){
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},10000);

function stamp(){var d=new Date(),p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function exportXlsx(all){
  var sheets=[];
  (all?state.pages:[cur()]).forEach(function(pg){
    var rows=pg.rows.filter(function(r){return r.v.some(function(x){return String(x).trim()})});
    if(rows.length)sheets.push({name:pg.name,header:pg.cols.slice(0,5),rows:rows.map(function(r){return r.v})});
  });
  if(!sheets.length){toast(all?"Nada para exportar":"Nada para exportar nesta página");return}
  try{
    download(buildXlsx(sheets),"apontamentos-"+stamp()+".xlsx");
    toast(all&&sheets.length>1?"Planilha exportada ("+sheets.length+" páginas)":"Planilha exportada");
  }catch(e){toast("Não foi possível exportar")}
}

  openSheet("Exportar XLSX","Escolha o que vai na planilha.",[
    {label:"Somente esta página ("+cur().name+")",pri:true,fn:function(){exportXlsx(false)}},
    {label:"Todas as páginas ("+n+", uma aba para cada)",fn:function(){exportXlsx(true)}}
  ]);
});

var query="",lastShown=0;
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function setCount(shown){
  lastShown=shown;
  var n=cur().rows.length,q=query.trim();
  $("count").textContent=(q?shown+" de "+n+" linhas":n+(n===1?" linha":" linhas"))+(sync.label?" · "+sync.label:"")+" · arraste o nº para mover · toque no título para renomear"+(storageOk?"":" · salvamento indisponível");
}
function applyFilter(){
  var pg=cur(),q=norm(query.trim()),els=tbl.querySelectorAll(".r:not(.h)"),shown=0;
  for(var i=0;i<els.length;i++){
    var hit=!q||norm(pg.rows[i].v.join(" ")).indexOf(q)>-1,was=els[i].hidden;
    els[i].hidden=!hit;
    if(hit){shown++;if(was)growRow(els[i])}
  }
  setCount(shown);
}

function sanitize(d){
  var pgs=d&&(Array.isArray(d.pages)?d.pages:(Array.isArray(d.cols)&&Array.isArray(d.rows)?[d]:null));
  if(!pgs||!pgs.length)return null;
  var seen={};
  return pgs.filter(function(p){return p&&typeof p==="object"}).map(function(p,i){
    var cols=Array.isArray(p.cols)?p.cols.map(function(c){return String(c==null?"":c).slice(0,40)}):null;
    var rows=(Array.isArray(p.rows)?p.rows:[]).map(function(r){
      var v=r&&Array.isArray(r.v)?r.v:[];
      return{id:r&&r.id?String(r.id):uid(),v:[0,1,2,3,4].map(function(i){return v[i]==null?"":String(v[i])})};
    });
    var pg=fix({id:p.id?String(p.id):null,name:String(p.name||"").slice(0,24),cols:cols,rows:rows,c:typeof p.c==="number"?p.c:0},i);
    while(seen[pg.id])pg.id=uid();

  });
}

  }

  save(true);render();window.scrollTo(0,0);

}

function h53(s){
  var h1=0xdeadbeef,h2=0x41c6ce57,i,ch;
  for(i=0;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}

function fromDoc(id,d){
  try{
    var rows=JSON.parse(d.rows),cols=Array.isArray(d.cols)?d.cols.slice(0,5).map(String):null;
    if(!Array.isArray(rows)||!cols)return null;
    while(cols.length<5)cols.push("Coluna "+(cols.length+1));
    rows=rows.map(function(x){
      var v=x&&Array.isArray(x.v)?x.v:[];
      return{id:String(x&&x.id?x.id:uid()),v:[0,1,2,3,4].map(function(i){return v[i]==null?"":String(v[i])})};
    });
    return{id:id,name:String(d.name||"Página"),cols:cols,rows:rows,c:+d.c||0,u:+d.updatedAt||0};
  }catch(e){return null}
}
function toPage(r){return fix({id:r.id,name:r.name,cols:r.cols,rows:r.rows,c:r.c,u:r.u})}

/* envia as páginas que mudaram e apaga na nuvem as que foram excluídas aqui */
function syncSchedule(){if(!sync.on||!sync.ready)return;clearTimeout(sync.t);sync.t=setTimeout(syncPush,700)}
function syncPush(){
  if(!sync.on||!sync.ready||sync.pending)return; /* com novidades da nuvem na fila, primeiro junta, depois envia */
  var fb=sync.fb,col=fb.collection(sync.db,"users",sync.user.uid,"pages"),seen={};
  state.pages.forEach(function(p){
    seen[p.id]=1;
    var h=pageHash(p);
    if(sync.pushed[p.id]===h)return;
    sync.pushed[p.id]=h;sync.base[p.id]=JSON.stringify([p.name,p.cols,p.rows]);
    if(!p.u)p.u=Date.now();
    fb.setDoc(fb.doc(col,p.id),{name:p.name,cols:p.cols,rows:JSON.stringify(p.rows),c:p.c,updatedAt:p.u})
      .catch(function(e){delete sync.pushed[p.id];syncFail(e)});
  });
  Object.keys(sync.pushed).forEach(function(id){
    if(seen[id])return;

function synced(r,h){sync.pushed[r.id]=h;sync.base[r.id]=JSON.stringify([r.name,r.cols,r.rows])}
/* junta, linha por linha, o que mudou aqui com o que mudou na nuvem desde a última sincronização (base) */
function mergePage(lp,r,base){
  if(!base){ /* sem base: vence a edição mais recente */
    if((lp.u||0)>r.u)return false;
    lp.name=r.name;lp.cols=r.cols;lp.rows=r.rows;lp.c=r.c||lp.c;lp.u=r.u;
    return true;
  }
  var brows={};
  base[2].forEach(function(x){brows[x.id]=JSON.stringify(x.v)});
  var L={},R={},out=[];
  lp.rows.forEach(function(x){L[x.id]=x});
  r.rows.forEach(function(x){R[x.id]=x});
  r.rows.forEach(function(x){
    var l=L[x.id],rv=JSON.stringify(x.v),bv=brows[x.id];
    if(l){
      var lv=JSON.stringify(l.v);
      out.push({id:x.id,v:(lv===rv||lv===bv)?x.v:l.v}); /* só um lado mudou: vale o que mudou; os dois: vale o daqui */
    }else if(!(bv!==undefined&&rv===bv)){out.push(x)} /* nova na nuvem (ou editada lá), não apagada aqui sem mexer */
  });
  lp.rows.forEach(function(x,i){
    if(R[x.id])return;
    var bv=brows[x.id];
    if(bv!==undefined&&JSON.stringify(x.v)===bv)return; /* apagada na nuvem e sem edição aqui */
    var at=out.length;
    for(var k=i-1;k>=0;k--){var j=idxOf(out,lp.rows[k].id);if(j>=0){at=j+1;break}}
    out.splice(at,0,x);
  });

  if(lp.name===base[0])lp.name=r.name;

  return true;

/* aplica o que veio da nuvem; páginas alteradas aqui e ainda não enviadas ganham, salvo se a nuvem for mais recente */
function applyRemote(snap){
  if(!sync.on)return;
  var wait=2000-(Date.now()-sync.lastInput);
  if(wait>0||renaming||document.querySelector(".r.drag")){
    sync.pending=snap;clearTimeout(sync.pt);
    sync.pt=setTimeout(function(){var s=sync.pending;sync.pending=null;if(s)applyRemote(s)},Math.max(wait,300)+50);
    return;
  }
  sync.pending=null;clearTimeout(sync.pt);
  var first=!sync.ready,changed=false,remote={},ids=[];
  snap.forEach(function(d){
    var r=fromDoc(d.id,d.data());if(!r)return;
    r.pend=!!(d.metadata&&d.metadata.hasPendingWrites);remote[d.id]=r;ids.push(d.id);
  });
  if(first&&ids.length&&!Object.keys(sync.pushed).length&&state.pages.every(pristine)){state.pages=[];changed=true}
  ids.forEach(function(id){
    var r=remote[id];if(r.pend)return;
    var rh=pageHash(r),ph=sync.pushed[id],lp=pageById(id);
    if(!lp){
      if(ph!==undefined)return; /* apagada aqui; a exclusão ainda vai para a nuvem */
      state.pages.push(toPage(r));synced(r,rh);changed=true;return;
    }
    if(rh===ph)return;
    var lh=pageHash(lp);
    if(lh===rh){synced(r,rh);return}
    var dirty=ph===undefined||lh!==ph;
    if(!dirty){
      lp.name=r.name;lp.cols=r.cols;lp.rows=r.rows;lp.c=r.c||lp.c;lp.u=r.u;
      synced(r,rh);changed=true;
    }else{
      var base=null;try{base=sync.base[id]?JSON.parse(sync.base[id]):null}catch(e){}
      if(mergePage(lp,r,base)){synced(r,rh);changed=true}
    }
  });
  state.pages=state.pages.filter(function(p){
    if(remote[p.id]||sync.pushed[p.id]===undefined)return true;
    if(pageHash(p)!==sync.pushed[p.id])return true; /* alterada aqui: mantém e reenvia */
    delete sync.pushed[p.id];delete sync.base[p.id];changed=true;return false;
  });
  state.pages.sort(function(a,b){return (a.c-b.c)||(a.id<b.id?-1:1)});
  if(!state.pages.length){state.pages=[newPage("Página 1",DEF,5)];changed=true}
  if(!pageById(state.active)){state.active=state.pages[0].id;changed=true}
  sync.ready=true;savePushed();
  if(changed){
    try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOk=false}
    var keep=null,ae=document.activeElement;
    if(ae&&ae.tagName==="TEXTAREA"&&tbl.contains(ae)){
      var re=ae.closest(".r");
      if(re&&re.dataset.id)keep={id:re.dataset.id,i:Array.prototype.indexOf.call(re.querySelectorAll("textarea"),ae),s:ae.selectionStart,e:ae.selectionEnd};
    }
    render();

      var rows=tbl.querySelectorAll(".r:not(.h)");
      for(var k=0;k<rows.length;k++)if(rows[k].dataset.id===keep.id){
        var f=rows[k].querySelectorAll("textarea")[keep.i];
        if(f){f.focus({preventScroll:true});try{f.setSelectionRange(keep.s,keep.e)}catch(_){}}
        break;
      }
    }
  }
  syncSchedule();
}
