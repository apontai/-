<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Apontamentos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apontamentos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<style>
:root{--bg:#f1f4f3;--card:#fff;--text:#14201d;--muted:#6b7b76;--line:#c9d4d0;--grid:#9fb0aa;--brand:#0f766e;--brand-t:#fff;--danger:#c0392b;--zebra:#f6f9f8;--gut:#e7eeec;--shadow:0 2px 10px rgba(0,0,0,.08);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#16201e;--text:#e8f0ee;--muted:#93a6a1;--line:#2b3a35;--grid:#47605a;--brand:#ffd000;--brand-t:#06201c;--danger:#ff7b6b;--zebra:#1a2623;--gut:#101a18;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 50px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:120px;overscroll-behavior-y:contain;display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{padding:14px 12px 10px;max-width:760px;width:100%;margin:0 auto}
h1{font-size:24px;margin:0;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
main{padding:0 8px;max-width:760px;width:100%;margin:0 auto;flex:1}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 8px 2px}
.tbl{--card:#fff;--text:#14201d;--muted:#5f6f6a;--line:#c9d4d0;--grid:#9fb0aa;--zebra:#eef4f2;--gut:#e3ebe8;--danger:#c0392b;color-scheme:light;background:var(--card);border:1.5px solid var(--grid);border-radius:14px;box-shadow:var(--shadow);overflow:clip}
.r{display:grid;grid-template-columns:30px repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.r:nth-child(even):not(.h){background:var(--zebra)}
.h{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--brand);border-bottom:0}
.hc{display:flex;align-items:center;border-left:1px solid rgba(255,255,255,.35);min-width:0}
.h textarea{font:700 12px/1.25 system-ui,sans-serif;color:var(--brand-t);background:transparent;padding:12px 4px;text-align:center;text-transform:uppercase;letter-spacing:.3px;box-shadow:none}
.hc:focus-within{background:rgba(255,255,255,.2)}
.h textarea:focus{background:transparent;box-shadow:none}
.h .g{background:transparent;color:var(--brand-t)}
.g{background:var(--gut);border:0;border-right:1px solid var(--grid);color:var(--muted);font:600 11px system-ui,sans-serif;padding:0;display:flex;align-items:flex-start;justify-content:center;padding-top:11px}
.g.armed{background:var(--danger);color:#fff;font-size:16px;padding-top:7px}
.c{display:flex;border-left:1px solid var(--line);min-width:0}
.c:nth-child(2){border-left:0}
textarea{font:inherit;font-size:15px;line-height:1.25;color:var(--text);background:transparent;border:0;border-radius:0;padding:9px 5px;width:100%;min-width:0;resize:none;outline:none;overflow:hidden;display:block}
textarea:focus{background:#e2f3f0;box-shadow:inset 0 0 0 2px #0f766e}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar{display:flex;align-items:center;gap:6px;padding:8px 10px 0;max-width:760px;margin:0 auto}
.tabs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;max-width:150px;height:34px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:600 14px system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--brand-t)}
input.tab{width:130px;font-size:16px;outline:none;text-overflow:clip;cursor:text}
.pbtn{flex:0 0 auto;width:34px;height:34px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:700 16px system-ui,sans-serif;padding:0}
.pbtn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;max-width:760px;margin:0 auto}
.bar button[hidden]{display:none}
.bar button{border:0;border-radius:12px;height:40px;padding:0 16px;font:700 15px system-ui,sans-serif}
#add{background:var(--brand);color:var(--brand-t);box-shadow:var(--shadow)}
#exp,#inst{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
#undo,#redo{width:40px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--text);border:1.5px solid var(--line)}
#redo svg{transform:scaleX(-1)}
.bar button:disabled{opacity:.35}
.bar button:disabled:active{transform:none}
#exp{margin-left:auto}
button:active{transform:scale(.97)}
#toast{position:fixed;left:50%;bottom:calc(var(--dockh,100px) + 12px);transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header>
  <h1>Apontamentos</h1>
  <div class="sub" id="count"></div>
</header>
<main>
  <div class="tbl" id="tbl"></div>
</main>
<footer>Developer by Pedro Santos</footer>
<div class="dock">
  <div class="tabbar">
    <div class="tabs" id="tabs"></div>
    <button class="pbtn" id="addp" aria-label="Nova página">＋</button>
    <button class="pbtn" id="delp" aria-label="Excluir página">🗑</button>
  </div>
  <div class="bar">
    <button id="add">＋ Nova linha</button>
    <button id="undo" aria-label="Desfazer exclusão" title="Desfazer" disabled><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 18c0-6.2-4.2-10.5-9.5-10.5C8 7.5 5.7 8.7 4.2 11"/><path d="M3.6 5.2 4.2 11.2 10 10.2"/></svg></button>
    <button id="redo" aria-label="Refazer exclusão" title="Refazer" disabled><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 18c0-6.2-4.2-10.5-9.5-10.5C8 7.5 5.7 8.7 4.2 11"/><path d="M3.6 5.2 4.2 11.2 10 10.2"/></svg></button>
    <button id="exp">⬇ XLSX</button>
    <button id="inst" hidden>⬇ Instalar</button>
  </div>
</div>
<div id="toast"></div>
<script>
(function(){
"use strict";
var KEY="apontamentos:v2",OLDKEY="apontamentos:v1";
var DEF=["Hora início","Hora final","Qtd colaboradores","Cod","Descrição"];
var OLD="Data|Local|Descrição|Qtd|Obs";
var storageOk=true;
var state={pages:[],active:null},renaming=null;

/* ---------- Salvamento ---------- */
function newPage(name,cols,n){
  var p={id:uid(),name:name,cols:(cols||DEF).slice(0,5),rows:[]};
  for(var i=0;i<(n||0);i++)p.rows.push(blank());
  return p;
}
function fix(p){
  if(!p.id)p.id=uid();
  if(!p.name)p.name="Página";
  if(!p.cols)p.cols=DEF.slice();
  if(p.cols.slice(0,5).join("|")===OLD)p.cols=DEF.slice();
  while(p.cols.length<5)p.cols.push("Coluna "+(p.cols.length+1));
  if(!p.rows)p.rows=[];
  return p;
}
function cur(){
  for(var i=0;i<state.pages.length;i++)if(state.pages[i].id===state.active)return state.pages[i];
  return state.pages[0];
}
function load(){
  var p=null;
  try{
    var s=localStorage.getItem(KEY)||localStorage.getItem(OLDKEY); /* v1 = dados da versão sem páginas */
    if(s)p=JSON.parse(s);
  }catch(e){storageOk=false}
  if(p&&p.pages&&p.pages.length){state.pages=p.pages.map(fix);state.active=p.active}
  else if(p&&p.cols&&p.rows){state.pages=[fix({name:"Página 1",cols:p.cols,rows:p.rows})]}
  if(!state.pages.length)state.pages=[newPage("Página 1",DEF,5)];
  if(!state.pages.some(function(x){return x.id===state.active}))state.active=state.pages[0].id;
}
var t=null;
function save(now){
  clearTimeout(t);
  var go=function(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOk=false}};
  if(now)go();else t=setTimeout(go,250);
}
window.addEventListener("pagehide",function(){save(true)});
document.addEventListener("visibilitychange",function(){if(document.hidden)save(true)});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

/* ---------- Gerador de XLSX (sem bibliotecas, funciona offline) ---------- */
var CRC=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){
  var enc=new TextEncoder(),parts=[],cen=[],off=0,cenSize=0;
  files.forEach(function(f){
    var name=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);
    var l=new Uint8Array(30+name.length),v=new DataView(l.buffer);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);
    v.setUint16(12,0x21,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);
    v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);l.set(name,30);
    var c=new Uint8Array(46+name.length),w=new DataView(c.buffer);
    w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x0800,true);
    w.setUint16(14,0x21,true);w.setUint32(16,crc,true);w.setUint32(20,data.length,true);
    w.setUint32(24,data.length,true);w.setUint16(28,name.length,true);w.setUint32(42,off,true);c.set(name,46);
    parts.push(l,data);cen.push(c);off+=l.length+data.length;cenSize+=c.length;
  });
  var end=new Uint8Array(22),e=new DataView(end.buffer);
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,cenSize,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[end]),{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function esc(s){return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function colLetter(i){return String.fromCharCode(65+i)}
function sheetXml(header,rows){
  var all=[header].concat(rows);
  var sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
   +'<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
   +'<cols><col min="1" max="1" width="13" customWidth="1"/><col min="2" max="2" width="13" customWidth="1"/><col min="3" max="3" width="20" customWidth="1"/><col min="4" max="4" width="12" customWidth="1"/><col min="5" max="5" width="45" customWidth="1"/></cols><sheetData>';
  all.forEach(function(r,i){
    sheet+='<row r="'+(i+1)+'">';
    r.forEach(function(v,j){
      if(v===""||v==null)return;
      sheet+='<c r="'+colLetter(j)+(i+1)+'" t="inlineStr"'+(i===0?' s="1"':' s="2"')+'><is><t xml:space="preserve">'+esc(v)+'</t></is></c>';
    });
    sheet+='</row>';
  });
  sheet+='</sheetData></worksheet>';
  return sheet;
}
function sheetName(s,used){
  var n=String(s||"").replace(/[\\\/\?\*\[\]:]/g,"-").replace(/^'+|'+$/g,"").trim().slice(0,31)||"Página";
  var base=n,k=2;
  while(used[n.toLowerCase()]){var suf=" ("+k+")";n=base.slice(0,31-suf.length)+suf;k++}
  used[n.toLowerCase()]=1;
  return n;
}
function buildXlsx(sheets){
  var NS='http://schemas.openxmlformats.org/',used={},ct="",wb="",rel="",files=[];
  sheets.forEach(function(sh,i){
    var n=i+1;
    ct+='<Override PartName="/xl/worksheets/sheet'+n+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    wb+='<sheet name="'+esc(sheetName(sh.name,used)).replace(/"/g,"&quot;")+'" sheetId="'+n+'" r:id="rId'+n+'"/>';
    rel+='<Relationship Id="rId'+n+'" Type="'+NS+'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+n+'.xml"/>';
    files.push({name:"xl/worksheets/sheet"+n+".xml",text:sheetXml(sh.header,sh.rows)});
  });
  rel+='<Relationship Id="rId'+(sheets.length+1)+'" Type="'+NS+'officeDocument/2006/relationships/styles" Target="styles.xml"/>';
  return zip([
    {name:"[Content_Types].xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="'+NS+'package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+ct+'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:"_rels/.rels",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="'+NS+'package/2006/relationships"><Relationship Id="rId1" Type="'+NS+'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:"xl/workbook.xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="'+NS+'spreadsheetml/2006/main" xmlns:r="'+NS+'officeDocument/2006/relationships"><sheets>'+wb+'</sheets></workbook>'},
    {name:"xl/_rels/workbook.xml.rels",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="'+NS+'package/2006/relationships">'+rel+'</Relationships>'},
    {name:"xl/styles.xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="'+NS+'spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0F766E"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
  ].concat(files));
}

/* ---------- Interface ---------- */
var $=function(id){return document.getElementById(id)};
var tbl=$("tbl");
function toast(m){var e=$("toast");e.textContent=m;e.className="show";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=""},2600)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function blank(){return{id:uid(),v:["","","","",""]}}
function growRow(el){
  var ta=el.querySelectorAll("textarea"),m=0,i;
  for(i=0;i<ta.length;i++){ta[i].style.height="auto"}
  for(i=0;i<ta.length;i++){m=Math.max(m,ta[i].scrollHeight)}
  for(i=0;i<ta.length;i++){ta[i].style.height=m+"px"}
}
function growHead(){tbl.querySelectorAll(".h textarea").forEach(function(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"})}
function growAll(){growHead();tbl.querySelectorAll(".r:not(.h)").forEach(growRow)}
function header(){
  var pg=cur(),h=document.createElement("div");h.className="r h";
  var g=document.createElement("div");g.className="g";g.textContent="#";h.appendChild(g);
  for(var i=0;i<5;i++)(function(i){
    var w=document.createElement("div");w.className="hc";
    var inp=document.createElement("textarea");inp.rows=1;inp.value=pg.cols[i];inp.maxLength=40;
    inp.setAttribute("aria-label","Nome da coluna "+(i+1));
    inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();inp.blur()}});
    inp.addEventListener("input",function(){pg.cols[i]=inp.value||("Coluna "+(i+1));growHead();save()});
    w.appendChild(inp);h.appendChild(w);
  })(i);
  return h;
}
function rowEl(r,n){
  var pg=cur(),el=document.createElement("div");el.className="r";el.dataset.id=r.id;
  var g=document.createElement("button");g.className="g";g.textContent=n;g.setAttribute("aria-label","Excluir linha "+n);
  g.addEventListener("click",function(){
    if(!g.classList.contains("armed")){
      g.classList.add("armed");g.textContent="×";
      setTimeout(function(){g.classList.remove("armed");g.textContent=n},2500);return;
    }
    var at=idxOf(pg.rows,r.id);if(at<0)return;pg.rows.splice(at,1);pushOp({t:"row",pid:pg.id,i:at,row:r});save(true);render();
  });
  el.appendChild(g);
  for(var i=0;i<5;i++)(function(i){
    var c=document.createElement("div");c.className="c";
    var ta=document.createElement("textarea");ta.rows=1;ta.value=r.v[i]||"";
    ta.setAttribute("aria-label",pg.cols[i]+", linha "+n);
    ta.addEventListener("input",function(){r.v[i]=ta.value;growRow(el);save()});
    c.appendChild(ta);el.appendChild(c);
  })(i);
  return el;
}
function render(){
  var pg=cur();
  tbl.innerHTML="";
  tbl.appendChild(header());
  pg.rows.forEach(function(r,k){tbl.appendChild(rowEl(r,k+1))});
  growAll();
  $("count").textContent=pg.rows.length+(pg.rows.length===1?" linha":" linhas")+" · toque no título da coluna para renomear"+(storageOk?"":" · salvamento indisponível");
  renderTabs();
}

/* ---------- Páginas (abas) ---------- */
var tabs=$("tabs"),delp=$("delp"),delArmed=false,delT=null;
function disarm(){clearTimeout(delT);delArmed=false;delp.classList.remove("armed");delp.textContent="🗑"}
function renderTabs(){
  tabs.innerHTML="";
  state.pages.forEach(function(p){
    if(renaming===p.id){
      var inp=document.createElement("input");inp.className="tab on";inp.value=p.name;inp.maxLength=24;
      inp.setAttribute("aria-label","Nome da página");
      var done=false;
      var finish=function(ok){
        if(done)return;done=true;
        var v=inp.value.trim();
        if(ok&&v)p.name=v;
        renaming=null;save(true);renderTabs();
      };
      inp.addEventListener("keydown",function(e){
        if(e.key==="Enter"){e.preventDefault();finish(true)}
        else if(e.key==="Escape"){finish(false)}
      });
      inp.addEventListener("blur",function(){finish(true)});
      tabs.appendChild(inp);
      inp.focus();inp.select();
    }else{
      var on=p.id===state.active;
      var b=document.createElement("button");b.className="tab"+(on?" on":"");b.textContent=p.name;
      b.setAttribute("aria-label","Página "+p.name+(on?", toque para renomear":""));
      b.addEventListener("click",function(){
        if(on){renaming=p.id;renderTabs();return}
        state.active=p.id;renaming=null;disarm();save(true);render();window.scrollTo(0,0);
      });
      tabs.appendChild(b);
    }
  });
  var a=tabs.querySelector(".on");
  if(a){
    var l=a.offsetLeft,r=l+a.offsetWidth;
    if(l<tabs.scrollLeft)tabs.scrollLeft=l-8;
    else if(r>tabs.scrollLeft+tabs.clientWidth)tabs.scrollLeft=r-tabs.clientWidth+8;
  }
}
/* ---------- Desfazer / Refazer (exclusões de linhas e páginas) ---------- */
var undoS=[],redoS=[];
function idxOf(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return i;return -1}
function histBtns(){$("undo").disabled=!undoS.length;$("redo").disabled=!redoS.length}
function pushOp(op){undoS.push(op);if(undoS.length>50)undoS.shift();redoS=[];histBtns()}
function pageById(id){var i=idxOf(state.pages,id);return i<0?null:state.pages[i]}
function undoOp(op){
  if(op.t==="row"){
    var pg=pageById(op.pid);if(!pg)return false;
    pg.rows.splice(Math.min(op.i,pg.rows.length),0,op.row);state.active=pg.id;
  }else{
    state.pages.splice(Math.min(op.i,state.pages.length),0,op.page);state.active=op.page.id;
  }
  return true;
}
function redoOp(op){
  if(op.t==="row"){
    var pg=pageById(op.pid);if(!pg)return false;
    var at=idxOf(pg.rows,op.row.id);if(at<0)return false;
    pg.rows.splice(at,1);state.active=pg.id;
  }else{
    var i=idxOf(state.pages,op.page.id);if(i<0||state.pages.length<2)return false;
    state.pages.splice(i,1);state.active=state.pages[Math.max(0,i-1)].id;
  }
  return true;
}
function stepHistory(from,to,fn,msg){
  var op=from.pop();if(!op)return;
  if(!fn(op)){histBtns();toast("Não foi possível");return}
  to.push(op);histBtns();renaming=null;disarm();save(true);render();
  toast(msg+(op.t==="row"?"linha":"página"));
}
$("undo").addEventListener("click",function(){stepHistory(undoS,redoS,undoOp,"Restaurada: ")});
$("redo").addEventListener("click",function(){stepHistory(redoS,undoS,redoOp,"Excluída de novo: ")});
var dock=document.querySelector(".dock");
function dockSize(){
  var h=dock.offsetHeight;
  document.documentElement.style.setProperty("--dockh",h+"px");
  document.body.style.paddingBottom=(h+16)+"px";
}
if(window.ResizeObserver)new ResizeObserver(dockSize).observe(dock);
window.addEventListener("resize",dockSize);

$("addp").addEventListener("click",function(){
  var names={},n=state.pages.length+1;
  state.pages.forEach(function(p){names[p.name.toLowerCase()]=1});
  while(names["página "+n])n++;
  var p=newPage("Página "+n,cur().cols,5); /* herda os nomes das colunas da página atual */
  state.pages.push(p);state.active=p.id;renaming=null;disarm();save(true);render();window.scrollTo(0,0);
});
delp.addEventListener("click",function(){
  if(!delArmed){
    if(state.pages.length<2){toast("Precisa ter pelo menos uma página");return}
    delArmed=true;delp.classList.add("armed");delp.textContent="×";
    delT=setTimeout(disarm,2500);return;
  }
  var i=0;
  while(i<state.pages.length&&state.pages[i].id!==state.active)i++;
  var gone=state.pages.splice(i,1)[0];
  pushOp({t:"page",i:i,page:gone});
  state.active=state.pages[Math.max(0,i-1)].id;
  renaming=null;disarm();save(true);render();window.scrollTo(0,0);toast("Página excluída");
});
window.addEventListener("resize",growAll);
$("add").addEventListener("click",function(){
  var r=blank();cur().rows.push(r);save(true);render();
  var el=tbl.querySelector('[data-id="'+r.id+'"]');
  if(el){el.scrollIntoView({behavior:"smooth",block:"center"});var f=el.querySelector("textarea");if(f)setTimeout(function(){f.focus({preventScroll:true})},250)}
});
$("exp").addEventListener("click",function(){
  var pg=cur(),sheets=[];
  var rows=pg.rows.filter(function(r){return r.v.some(function(x){return String(x).trim()})});
  if(rows.length)sheets.push({name:pg.name,header:pg.cols.slice(0,5),rows:rows.map(function(r){return r.v})});
  if(!sheets.length){toast("Nada para exportar nesta página");return}
  try{
    var blob=buildXlsx(sheets);
    var d=new Date(),p=function(n){return String(n).padStart(2,"0")};
    var name="apontamentos-"+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+".xlsx";
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},10000);
    toast("Planilha exportada");
  }catch(e){toast("Não foi possível exportar")}
});
load();save(true);
render();histBtns();dockSize();

var deferred=null,inst=document.getElementById("inst");
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;inst.hidden=false});
inst.addEventListener("click",function(){if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;inst.hidden=true})});
window.addEventListener("appinstalled",function(){inst.hidden=true});

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
}
})();
</script>
